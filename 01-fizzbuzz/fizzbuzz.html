<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FizzBuzz</title>

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <h1>FizzBuzz - Game</h1>
    <!-- <p>Update Dynamic & Reusable function (Parameter)</p> -->
    <!-- <p>Save data in Array and Return</p> -->

    <!-- 
        Famous FizzBuzz problem 
        if the number is divisible by 3, display "Fizz" instead of the number,
        if it's divisible by 5, display "Buzz" instead, 
        if it's divisible by 3 and 5, display "FizzBuzz" instead.
    -->

    <!-- 1: HTML (UI Elements) -->
    <input
      type="number"
      id="input-number"
      class="number-input"
      placeholder="Number"
    />
    <button id="btn-enter" class="enter-button">Enter</button>
    <button id="btn-clear" class="clear-button">Clear</button>

    <!-- Display element on page -->
    <div id="display"></div>

    <script src="./script.js"></script>
  </body>
</html>
